x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      PII_REDIS_URL: redis://redis:6379/0
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs:
      - /tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 1gb --maxmemory-policy volatile-ttl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
