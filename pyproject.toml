[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii_guard"
version = "0.1.0"
description = "Модуль безопасности персональных данных (прокси между системой-потребителем и LLM)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "uvicorn-worker",
    "gunicorn",
    "orjson",
    "pydantic>=2.7",
    "pydantic-settings",
    "redis[hiredis]>=5",
    "cryptography",
    "structlog",
    "prometheus-client",
    "httpx",
    "pyyaml",
    "pymorphy3",
    "pymorphy3-dicts-ru",
    "faker",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.44",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "respx",
    "fakeredis",
    "ruff",
    "mypy",
    "bandit",
    "types-PyYAML",
    "rapidfuzz",
    "pyarrow",
    "huggingface_hub",
]

[tool.setuptools.packages.find]
include = ["pii_guard*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "S", "RUF"]
# проект работает с русским текстом: кириллица в строках и комментариях ожидаема
# SIM108 толкает к вложенным тернарным выражениям, которые Sonar считает нарушением
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"eval/**" = ["S311"]
"loadtest/**" = ["S311"]

[tool.mypy]
strict = true
files = ["pii_guard"]

[[tool.mypy.overrides]]
module = ["pymorphy3", "fakeredis", "uvicorn_worker", "prometheus_client", "prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "pyarrow", "pyarrow.*", "huggingface_hub"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# пакет eval лежит в корне репозитория и не устанавливается
pythonpath = ["."]
